[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "runner-python-sdk"
version = "0.1.0"
description = "Official Python SDK for reporting Runner automation execution transactions."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "typing-extensions>=4.8",
]
license = "MIT"
authors = [
  { name = "DClick" }
]
keywords = ["runner", "rpa", "automation", "progress", "transactions"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/dclick-rj/runner-python-sdk"
Repository = "https://github.com/dclick-rj/runner-python-sdk"
Issues = "https://github.com/dclick-rj/runner-python-sdk/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/runner"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
